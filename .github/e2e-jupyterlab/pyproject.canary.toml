# Template for canary E2E testing of the jupyterlab template.
# Placeholder replaced at build time by the Dockerfile:
#   {{PKG_PIN}}: "==<PKG_VERSION>" when the build passes the version the canary found on PyPI, else empty
# Everything else resolves to the latest from prod PyPI, same as a user running `pip install`.
# The pytest-jupyter-deploy harness comes from the checkout: the tests import their fixtures from it.
#
# The jupyterlab template reaches JupyterLab through the local client proxy, so the
# CLI install pulls the [aws,proxy] extra (aws SDK + the client-proxy console script).
[project]
name = "e2e-jupyterlab-canary"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "jupyter-deploy[aws,proxy]",
    "jupyter-deploy-tf-aws-ec2-jupyterlab{{PKG_PIN}}",
    "pytest-jupyter-deploy[ui]",
    "pytest-cov",
]

[tool.uv.sources]
pytest-jupyter-deploy = { path = "libs/pytest-jupyter-deploy", editable = true }
