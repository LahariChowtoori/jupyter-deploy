name: E2E base template

on:
  workflow_dispatch:
    inputs:
      oauth-app-num:
        description: "OAuth app number (1-3) — determines subdomain"
        required: false
        type: choice
        options: ["1", "2", "3"]
        default: "1"
      test-filter:
        description: "Pytest -k filter (applied to all jobs, empty = all tests)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to checkout (e.g. refs/pull/185/merge for a fork PR)"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: e2e-${{ inputs.oauth-app-num }}
  cancel-in-progress: false

jobs:
  build-image:
    name: "Build E2E image"
    uses: ./.github/workflows/e2e-build-image.yml
    secrets: inherit
    with:
      oauth-app-num: ${{ inputs.oauth-app-num }}
      ref: ${{ inputs.ref }}

  test-non-mutating:
    name: "Non-mutating tests"
    needs: build-image
    uses: ./.github/workflows/e2e-base-job.yml
    secrets: inherit
    with:
      oauth-app-num: ${{ inputs.oauth-app-num }}
      test-filter: ${{ inputs.test-filter }}
      ref: ${{ inputs.ref }}
      ecr-tag: ${{ needs.build-image.outputs.ecr-tag }}
      timeout-minutes: 120

  # Mutating tests, selected by MARKER rather than by file: `mutating and not gpu` picks up any new
  # mutating test automatically, where a per-file filter silently omits it. The GPU pass runs first
  # and on its own -- it is the expensive one, and the later applies depend on the state it leaves
  # (see libs/jupyter-deploy-tf-aws-ec2-base/tests/e2e/constants.py for the ordering contract).

  test-gpu:
    name: "Mutating tests (GPU swap)"
    needs: [build-image, test-non-mutating]
    uses: ./.github/workflows/e2e-base-job.yml
    secrets: inherit
    with:
      oauth-app-num: ${{ inputs.oauth-app-num }}
      test-filter: ${{ inputs.test-filter }}
      ref: ${{ inputs.ref }}
      ecr-tag: ${{ needs.build-image.outputs.ecr-tag }}
      marker: "gpu"
      artifact-name: mutating-gpu
      mutate: true
      timeout-minutes: 90

  test-mutating:
    name: "Mutating tests (CPU swap, allowlist, volumes)"
    needs: [build-image, test-gpu]
    uses: ./.github/workflows/e2e-base-job.yml
    secrets: inherit
    with:
      oauth-app-num: ${{ inputs.oauth-app-num }}
      test-filter: ${{ inputs.test-filter }}
      ref: ${{ inputs.ref }}
      ecr-tag: ${{ needs.build-image.outputs.ecr-tag }}
      marker: "mutating and not gpu"
      artifact-name: mutating
      mutate: true
      timeout-minutes: 120

  cleanup:
    name: "Cleanup: stop host"
    needs:
      - test-non-mutating
      - test-gpu
      - test-mutating
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install UV and Python
        uses: ./.github/actions/install-uv
        with:
          python-version: "3.13"

      - name: Install just
        uses: ./.github/actions/install-just

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::997498698382:role/jupyter-infra-ci-e2e-6a3e2625
          aws-region: us-west-2

      - name: Restore CI project
        run: just ci-restore sandbox-ci

      - name: Restore base project
        run: just ci-restore-base ${{ inputs.oauth-app-num }} sandbox-ci sandbox-e2e

      - name: Stop host
        run: just ensure-host-stopped sandbox-e2e
